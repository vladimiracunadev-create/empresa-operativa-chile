      - id: C09
        title: "Activo, pasivo y patrimonio"
        duration_minutes: 35
        level: "Fundamento"
        outcome: "Clasificar recursos, obligaciones y parte residual."
      - id: C10
        title: "Debe y haber"
        duration_minutes: 35
        level: "Fundamento"
        outcome: "Usar Debe/Haber después de identificar la cuenta y su cambio."
