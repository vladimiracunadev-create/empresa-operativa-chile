version: 2
country: CL
reference_date: 2026-10-29
pedagogical_contract: "observar -> razonar -> resolver -> comprobar -> aplicar"
guided_routes: 12
labs: 17
cases: 4
parts:
  - id: "00"
    slug: "mentalidad-contable"
    title: "Mentalidad contable"
    goal: "Aprender a reconstruir hechos con documentos y no a memorizar nombres de cuentas."
    classes:
      - id: C01
        title: "Qué resuelve la contabilidad"
        duration_minutes: 35
        level: "Fundamento"
        outcome: "Explicar qué preguntas responde un sistema contable."
      - id: C02
        title: "Documentos, hechos y evidencia"
        duration_minutes: 35
        level: "Fundamento"
        outcome: "Separar hecho, documento, registro y evidencia."
      - id: C03
        title: "Devengado vs percibido/pagado"
        duration_minutes: 35
        level: "Fundamento"
        outcome: "Distinguir reconocimiento económico y movimiento de caja."
      - id: C04
        title: "Ciclo mensual y anual"
        duration_minutes: 35
        level: "Fundamento"
        outcome: "Ubicar cada control en su frecuencia correcta."
  - id: "01"
    slug: "formalizacion-y-perfil-tributario"
    title: "Formalización y perfil tributario"
    goal: "Entender qué datos definen a la empresa antes de calcular obligaciones."
    classes:
      - id: C05
        title: "SpA unipersonal"
        duration_minutes: 35
        level: "Fundamento"
        outcome: "Distinguir sociedad, accionista y administrador."
      - id: C06
        title: "RUT e inicio de actividades"
        duration_minutes: 35
        level: "Fundamento"
        outcome: "Separar constitución, identificación e inicio tributario."
      - id: C07
        title: "Oficina virtual y domicilio"
        duration_minutes: 35
        level: "Fundamento"
        outcome: "Evaluar domicilio sin convertirlo en una garantía universal."
      - id: C08
        title: "Régimen Pro Pyme"
        duration_minutes: 35
        level: "Fundamento"
        outcome: "Reconocer que el régimen es un dato verificado, no una preferencia de cálculo."
  - id: "02"
