<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 684" width="1240" height="684" role="img" aria-label="La ruta completa: 14 etapas agrupadas en 5 fases, desde antes de que la empresa exista hasta el cierre del año">
