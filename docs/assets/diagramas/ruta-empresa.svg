  <text class="t h" x="28" y="44" fill="#e8edf5">LA RUTA COMPLETA — 14 ETAPAS</text>
  <text class="t s" x="28" y="62">Cada fase necesita la anterior. Las etapas marcadas exigen evidencia antes de darse por hechas.</text>
