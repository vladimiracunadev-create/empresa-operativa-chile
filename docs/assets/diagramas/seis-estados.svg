<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Los seis estados de una obligación: calculado y preparado los hace la aplicación; conciliado, presentado, pagado y evidenciado los haces tú">
  <style>
    .t  { font-family: "Segoe UI", system-ui, sans-serif; }
    .n  { font-size: 15px; font-weight: 650; fill: #e8edf5; }
    .s  { font-size: 11.5px; fill: #9aa8bf; }
    .h  { font-size: 12.5px; font-weight: 700; letter-spacing: 0.1em; }
    .num{ font-size: 15px; font-weight: 700; }
  </style>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3c4a63"/>
    </marker>
  </defs>

  <rect width="1200" height="330" rx="14" fill="#0f1521"/>

  <!-- Zonas -->
  <rect x="28" y="58" width="352" height="146" rx="12" fill="rgba(79,140,255,0.09)" stroke="rgba(79,140,255,0.42)"/>
  <rect x="404" y="58" width="768" height="146" rx="12" fill="rgba(240,168,60,0.08)" stroke="rgba(240,168,60,0.42)"/>

  <text class="t h" x="44" y="44" fill="#4f8cff">LO QUE PUEDE HACER LA APP</text>
  <text class="t h" x="420" y="44" fill="#f0a83c">LO QUE HACES TÚ</text>

  <!-- Cada columna: círculo arriba, texto centrado debajo en dos líneas. -->
  <g class="t" text-anchor="middle">
    <g transform="translate(115, 92)">
      <circle cy="20" r="20" fill="#4f8cff"/>
      <text class="num" y="26" fill="#fff">1</text>
      <text class="n" y="66">Calculado</text>
      <text class="s" y="86">el motor obtiene</text>
      <text class="s" y="102">la cifra</text>
    </g>
    <g transform="translate(293, 92)">
      <circle cy="20" r="20" fill="#4f8cff"/>
      <text class="num" y="26" fill="#fff">2</text>
      <text class="n" y="66">Preparado</text>
      <text class="s" y="86">el borrador</text>
      <text class="s" y="102">queda listo</text>
    </g>

    <g transform="translate(491, 92)">
      <circle cy="20" r="20" fill="none" stroke="#f0a83c" stroke-width="2.5"/>
      <text class="num" y="26" fill="#f0a83c">3</text>
      <text class="n" y="66">Conciliado</text>
      <text class="s" y="86">contra el RCV</text>
      <text class="s" y="102">del SII</text>
    </g>
    <g transform="translate(675, 92)">
      <circle cy="20" r="20" fill="none" stroke="#f0a83c" stroke-width="2.5"/>
      <text class="num" y="26" fill="#f0a83c">4</text>
      <text class="n" y="66">Presentado</text>
      <text class="s" y="86">en el portal</text>
      <text class="s" y="102">oficial</text>
    </g>
    <g transform="translate(859, 92)">
      <circle cy="20" r="20" fill="none" stroke="#f0a83c" stroke-width="2.5"/>
      <text class="num" y="26" fill="#f0a83c">5</text>
      <text class="n" y="66">Pagado</text>
      <text class="s" y="86">en el banco</text>
      <text class="s" y="102">o en el SII</text>
    </g>
    <g transform="translate(1058, 92)">
      <circle cy="20" r="20" fill="none" stroke="#34d399" stroke-width="2.5"/>
      <text class="num" y="26" fill="#34d399">6</text>
      <text class="n" y="66">Evidenciado</text>
      <text class="s" y="86">registras el folio</text>
      <text class="s" y="102">o comprobante</text>
    </g>
  </g>

  <!-- Flechas entre columnas -->
  <g stroke="#3c4a63" stroke-width="2" fill="none">
    <path d="M182 112 h34" marker-end="url(#fl)"/>
    <path d="M360 112 h48" marker-end="url(#fl)"/>
    <path d="M558 112 h34" marker-end="url(#fl)"/>
    <path d="M742 112 h34" marker-end="url(#fl)"/>
    <path d="M926 112 h48" marker-end="url(#fl)"/>
  </g>

  <!-- Resultado -->
  <g transform="translate(28, 232)">
    <rect width="1144" height="66" rx="12" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.45)"/>
    <circle cx="38" cy="33" r="14" fill="#34d399"/>
    <path d="M31 33 l5 5 l9 -9" stroke="#04241a" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t n" x="68" y="30" fill="#34d399">OBLIGACIÓN CUMPLIDA</text>
    <text class="t s" x="68" y="50">Sólo aquí. La aplicación nunca marca sola un trámite como hecho: sin comprobante registrado, se niega.</text>
  </g>
</svg>
