  <!-- Llamadas -->
  <g class="t">
    <g><circle cx="60" cy="53" r="11" fill="#4f8cff"/><text class="cal" x="60" y="57" text-anchor="middle">1</text></g>
    <g><circle cx="255" cy="53" r="11" fill="#4f8cff"/><text class="cal" x="255" y="57" text-anchor="middle">2</text></g>
    <g><circle cx="577" cy="53" r="11" fill="#4f8cff"/><text class="cal" x="577" y="57" text-anchor="middle">3</text></g>
    <g><circle cx="644" cy="53" r="11" fill="#4f8cff"/><text class="cal" x="644" y="57" text-anchor="middle">4</text></g>
    <g><circle cx="60" cy="136" r="11" fill="#4f8cff"/><text class="cal" x="60" y="140" text-anchor="middle">5</text></g>
    <g><circle cx="228" cy="105" r="11" fill="#4f8cff"/><text class="cal" x="228" y="109" text-anchor="middle">6</text></g>
    <g><circle cx="380" cy="215" r="11" fill="#4f8cff"/><text class="cal" x="380" y="219" text-anchor="middle">7</text></g>
  </g>

  <!-- Leyenda -->
  <g class="t" transform="translate(700, 40)">
    <g transform="translate(0, 0)"><circle cx="10" cy="10" r="10" fill="#4f8cff"/><text class="cal" x="10" y="14" text-anchor="middle">1</text>
      <text class="lbl" x="28" y="9">Marca y versión</text><text class="det" x="28" y="25">Dice en qué plataforma estás</text></g>
    <g transform="translate(0, 56)"><circle cx="10" cy="10" r="10" fill="#4f8cff"/><text class="cal" x="10" y="14" text-anchor="middle">2</text>
      <text class="lbl" x="28" y="9">Selector de entorno</text><text class="det" x="28" y="25">EMPRESA REAL o SANDBOX</text></g>
    <g transform="translate(0, 112)"><circle cx="10" cy="10" r="10" fill="#4f8cff"/><text class="cal" x="10" y="14" text-anchor="middle">3</text>
      <text class="lbl" x="28" y="9">Período de trabajo</text><text class="det" x="28" y="25">Todo lo que ves es de ese mes</text></g>
    <g transform="translate(0, 168)"><circle cx="10" cy="10" r="10" fill="#4f8cff"/><text class="cal" x="10" y="14" text-anchor="middle">4</text>
      <text class="lbl" x="28" y="9">Tema claro u oscuro</text><text class="det" x="28" y="25">Se recuerda entre sesiones</text></g>
    <g transform="translate(0, 224)"><circle cx="10" cy="10" r="10" fill="#4f8cff"/><text class="cal" x="10" y="14" text-anchor="middle">5</text>
      <text class="lbl" x="28" y="9">Navegación</text><text class="det" x="28" y="25">En el teléfono pasa abajo</text></g>
    <g transform="translate(0, 280)"><circle cx="10" cy="10" r="10" fill="#4f8cff"/><text class="cal" x="10" y="14" text-anchor="middle">6</text>
      <text class="lbl" x="28" y="9">Franja de entorno</text><text class="det" x="28" y="25">Ámbar = real · verde = sandbox</text></g>
    <g transform="translate(0, 336)"><circle cx="10" cy="10" r="10" fill="#4f8cff"/><text class="cal" x="10" y="14" text-anchor="middle">7</text>
      <text class="lbl" x="28" y="9">Área de trabajo</text><text class="det" x="28" y="25">Indicadores, tarjetas y tablas</text></g>
  </g>
</svg>
