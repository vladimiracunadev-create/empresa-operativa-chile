    <rect x="184" y="234" width="440" height="190" rx="9" fill="#121826" stroke="#232e42"/>
    <rect x="200" y="252" width="120" height="10" rx="5" fill="#e8edf5" opacity="0.75"/>
    <g fill="#232e42">
      <rect x="200" y="280" width="408" height="1.5"/>
      <rect x="200" y="308" width="408" height="1.5"/>
      <rect x="200" y="336" width="408" height="1.5"/>
      <rect x="200" y="364" width="408" height="1.5"/>
    </g>
    <g fill="#33415c">
