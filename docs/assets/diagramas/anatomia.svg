      <rect x="200" y="318" width="110" height="7" rx="3.5"/><rect x="330" y="318" width="52" height="7" rx="3.5"/><rect x="540" y="318" width="60" height="7" rx="3.5"/>
      <rect x="200" y="346" width="76" height="7" rx="3.5"/><rect x="330" y="346" width="68" height="7" rx="3.5"/><rect x="524" y="346" width="76" height="7" rx="3.5"/>
