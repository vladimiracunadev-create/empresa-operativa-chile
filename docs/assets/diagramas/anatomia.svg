      <rect x="296" y="152" width="104" height="66" rx="9" fill="#121826" stroke="#232e42"/>
      <rect x="308" y="164" width="46" height="6" rx="3" fill="#6b7a94"/>
      <rect x="308" y="180" width="60" height="14" rx="4" fill="#f0a83c" opacity="0.85"/>
      <rect x="308" y="202" width="72" height="5" rx="2.5" fill="#33415c"/>
