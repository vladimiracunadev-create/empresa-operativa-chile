      <rect x="532" y="164" width="50" height="6" rx="3" fill="#6b7a94"/>
      <rect x="532" y="180" width="62" height="14" rx="4" fill="#34d399" opacity="0.85"/>
      <rect x="532" y="202" width="70" height="5" rx="2.5" fill="#33415c"/>
