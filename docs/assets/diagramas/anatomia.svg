      <rect x="420" y="164" width="56" height="6" rx="3" fill="#6b7a94"/>
      <rect x="420" y="180" width="54" height="14" rx="4" fill="#e8edf5" opacity="0.8"/>
      <rect x="420" y="202" width="66" height="5" rx="2.5" fill="#33415c"/>
