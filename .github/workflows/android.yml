name: Android

# Empaqueta apps/web/dist en un APK con Capacitor. No hay código de app propio:
# la app ES la aplicación web.
#
# Lo que de verdad importa aquí no es que el APK compile, sino que lleve la
# aplicación dentro. Un APK vacío compila perfectamente: la WebView arranca,
# muestra una pantalla en blanco y todas las señales del build siguen en verde.
# Por eso `scripts/verify-apk.mjs` abre el ZIP y CUENTA lo que hay dentro antes
# de publicar nada.

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      artefacto:
        description: Nombre del artefacto con el APK
        value: EmpresaOperativaChile-android

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar y verificar el APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - name: Construir la aplicación web
        run: node scripts/build-all.mjs

      - name: Preparar el proyecto Capacitor
        working-directory: apps/android
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high
          node copiar-www.mjs
          pnpm exec cap add android
          # Segunda pasada: `cap add` acaba de crear android/, y es entonces
          # cuando se pueden aplicar los iconos propios sobre sus recursos.
          node copiar-www.mjs
          pnpm exec cap sync android

      - name: Compilar el APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verificar el contenido del APK
        run: node scripts/verify-apk.mjs apps/android/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Preparar el artefacto
        run: |
          set -euo pipefail
          mkdir -p artefactos
          cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk \
             artefactos/EmpresaOperativaChile-android.apk
          cd artefactos
          sha256sum EmpresaOperativaChile-android.apk > EmpresaOperativaChile-android.apk.sha256
          cat EmpresaOperativaChile-android.apk.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EmpresaOperativaChile-android
          path: artefactos/*
          if-no-files-found: error
          retention-days: 14

      - name: Resumen
        if: always()
        run: |
          {
            echo "### 📱 APK de Android"
            echo ""
            echo "El APK se verifica **por dentro**: se abre el ZIP y se cuentan las vistas,"
            echo "los módulos del motor de cálculo y las reglas tributarias antes de publicarlo."
            echo "Un build en verde no prueba que la app esté dentro; ese recuento sí."
            echo ""
            echo "APK de depuración, firmado con la clave de debug de Android:"
            echo "sirve para instalar y usar, no para publicar en Google Play."
          } >> "$GITHUB_STEP_SUMMARY"
