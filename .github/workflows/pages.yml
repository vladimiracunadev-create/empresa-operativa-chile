name: Pages

# Publica apps/web/dist en GitHub Pages. Es la misma aplicación que va en el APK
# y en el instalador de Windows, así que la demo pública nunca queda desfasada
# respecto de lo que la gente instala.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Construir y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          # Sin dependencias que instalar no hay store que cachear, y activarlo
          # sólo consigue que setup-node invoque pnpm sin necesitarlo.
          package-manager-cache: false

      - run: node scripts/build-all.mjs

      - name: Comprobar que se publica la app completa
        run: |
          set -euo pipefail
          test "$(find apps/web/dist/views -name '*.js' | wc -l)" -ge 10
          grep -q "Empresa Operativa Chile" apps/web/dist/index.html
          # Pages sirve archivos estáticos: sin este marcador, Jekyll se comería
          # cualquier ruta que empiece por guion bajo.
          touch apps/web/dist/.nojekyll

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
