name: 🏛️ Regla tributaria desactualizada o incorrecta
description: Una tasa, un plazo o un valor no coincide con la norma vigente
labels: [reglas, tributario]
body:
  - type: markdown
    attributes:
      value: |
        Este es el reporte más valioso del proyecto. Una tasa equivocada no rompe nada
        visiblemente: produce números plausibles que aparecen meses después como una diferencia
        con el SII.

        **La fuente oficial es obligatoria.** Sin ella no se puede cambiar una regla.

  - type: input
    id: regla
    attributes:
      label: Qué regla
      placeholder: 'honorarios.retentionRate · utm · f29.generalDueDay · idpcProPyme.rate…'
    validations:
      required: true

  - type: input
    id: anio
    attributes:
      label: Año comercial
      placeholder: '2026'
    validations:
      required: true

  - type: input
    id: actual
    attributes:
      label: Valor que tiene el repositorio
      placeholder: '0.1525'
    validations:
      required: true

  - type: input
    id: correcto
    attributes:
      label: Valor correcto
      placeholder: '0.17'
    validations:
      required: true

  - type: input
    id: fuente
    attributes:
      label: Fuente oficial (URL)
      description: SII, BCN/Ley Chile, Diario Oficial o el organismo que corresponda.
      placeholder: 'https://www.sii.cl/…'
    validations:
      required: true

  - type: input
    id: vigencia
    attributes:
      label: Desde cuándo rige
      placeholder: '2027-01-01'
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: |
        ¿Sustituye a la regla anterior o convive con ella según el caso? ¿Hay gradualidad?
        ¿Afecta a períodos ya cerrados?
